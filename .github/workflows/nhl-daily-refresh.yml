name: NHL Daily Refresh

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional replay date (YYYY-MM-DD); blank runs the normal morning refresh"
        required: false
        type: string
      rebuild_database:
        description: "Discard the restored database and run a full backfill first"
        required: false
        default: false
        type: boolean
  push:
    # Lets workflow changes prove themselves before merge without running on
    # every application commit. Scheduled workflows run from the default branch.
    paths:
      - ".github/workflows/nhl-daily-refresh.yml"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: nhl-daily-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Test and refresh NHL data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./data/nhl-actions.db
      SEED_CSV_PATH: data/data_dump.csv
      BACKFILL_START_SEASON_ID: "20222023"
      BACKFILL_THROUGH_SEASON_ID: "20262027"
      GAME_TYPE_ID: "2"
      DAILY_CORRECTION_LOOKBACK_DAYS: "3"
      DAILY_MAX_RECOVERY_DAYS: "14"
      DAILY_TIMEZONE: America/New_York

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install '.[api,test]'

      - name: Run tests
        run: python -m pytest -q

      - name: Restore latest database
        uses: actions/cache@v5
        with:
          path: data/nhl-actions.db
          key: nhl-actions-db-${{ runner.os }}-${{ hashFiles('storage/models.py') }}-${{ github.run_id }}
          restore-keys: |
            nhl-actions-db-${{ runner.os }}-${{ hashFiles('storage/models.py') }}-

      - name: Restore latest successful artifact on cache miss
        if: hashFiles('data/nhl-actions.db') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_SCHEMA_HASH: ${{ hashFiles('storage/models.py') }}
        run: |
          previous_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow nhl-daily-refresh.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            mkdir -p /tmp/nhl-previous
            gh run download "$previous_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name "nhl-daily-refresh-$previous_run" \
              --dir /tmp/nhl-previous
            previous_db="$(find /tmp/nhl-previous -name nhl-actions.db -type f -print -quit)"
            previous_schema="$(find /tmp/nhl-previous -name schema-hash.txt -type f -print -quit)"
            if [[ -n "$previous_db" && -n "$previous_schema" ]] \
              && [[ "$(<"$previous_schema")" == "$MODEL_SCHEMA_HASH" ]]; then
              cp "$previous_db" data/nhl-actions.db
              echo "Restored database artifact from successful run $previous_run."
            else
              echo "Previous artifact is absent or uses a different schema; a backfill is required."
            fi
          fi

      - name: Bootstrap database when needed
        env:
          REBUILD_DATABASE: ${{ inputs.rebuild_database || 'false' }}
        run: |
          if [[ "$REBUILD_DATABASE" == "true" ]]; then
            rm -f data/nhl-actions.db
          fi
          if [[ ! -s data/nhl-actions.db ]]; then
            python main.py backfill
          fi

      - name: Run incremental refresh
        env:
          REFRESH_AS_OF: ${{ inputs.as_of || '' }}
        run: |
          if [[ -n "$REFRESH_AS_OF" ]]; then
            python main.py refresh --as-of "$REFRESH_AS_OF" | tee data/refresh-result.json
          else
            python main.py refresh | tee data/refresh-result.json
          fi

      - name: Verify database and successful run
        run: |
          python - <<'PY'
          import json
          import sqlite3

          database = sqlite3.connect("data/nhl-actions.db")
          integrity = database.execute("PRAGMA quick_check").fetchone()[0]
          with open("data/refresh-result.json", encoding="utf-8") as result_file:
              result = json.load(result_file)
          status, counts = database.execute(
              "SELECT status, row_counts FROM pipeline_runs WHERE run_id = ?",
              (result["run_id"],),
          ).fetchone()
          assert integrity == "ok", integrity
          assert status == "succeeded", status
          stored_counts = json.loads(counts)
          assert stored_counts["run_id"] == result["run_id"]
          print(json.dumps({"integrity": integrity, "status": status, **stored_counts}, sort_keys=True))
          PY

      - name: Record database schema version
        if: always() && hashFiles('data/nhl-actions.db') != ''
        env:
          MODEL_SCHEMA_HASH: ${{ hashFiles('storage/models.py') }}
        run: printf '%s' "$MODEL_SCHEMA_HASH" > data/schema-hash.txt

      - name: Upload refreshed database and run summary
        if: always() && hashFiles('data/nhl-actions.db') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nhl-daily-refresh-${{ github.run_id }}
          path: |
            data/nhl-actions.db
            data/refresh-result.json
            data/schema-hash.txt
          if-no-files-found: error
          retention-days: 90
