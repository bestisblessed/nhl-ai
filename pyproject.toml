[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-pipeline"
version = "0.1.0"
description = "NHL take-home data pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.2"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ingestion*", "storage*", "utils*", "api*"]

[tool.setuptools]
py-modules = ["config", "main"]

[project.scripts]
nhl-pipeline = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
