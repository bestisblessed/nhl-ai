services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nhl:nhl@db:5432/nhl
      SEED_CSV_PATH: /app/data/data_dump.csv
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nhl
      POSTGRES_PASSWORD: nhl
      POSTGRES_DB: nhl
    volumes: [nhl-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhl -d nhl"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
volumes:
  nhl-data:
